<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 SAT Words in 20 Days</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --bg-card-hover: #1f1f35;
            --border: #2a2a4a;
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0c0;
            --accent: #6c63ff;
            --accent-light: #8b83ff;
            --accent-glow: rgba(108,99,255,0.3);
            --green: #22c55e;
            --green-glow: rgba(34,197,94,0.3);
            --orange: #f59e0b;
            --red: #ef4444;
            --gradient-1: linear-gradient(135deg, #6c63ff, #a78bfa);
            --gradient-2: linear-gradient(135deg, #22c55e, #4ade80);
            --gradient-3: linear-gradient(135deg, #f59e0b, #fbbf24);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }

        /* HERO */
        .hero {
            position: relative;
            padding: 5rem 2rem 4rem;
            text-align: center;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 0%, rgba(108,99,255,0.15) 0%, transparent 60%);
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-conic-gradient(from 0deg, transparent 0deg 8deg, rgba(108,99,255,0.03) 8deg 10deg);
            animation: rotate 120s linear infinite;
        }
        @keyframes rotate { to { transform: rotate(360deg); } }
        .hero-content { position: relative; z-index: 1; }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 900;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            margin-bottom: 1rem;
        }
        .hero p { font-size: 1.2rem; color: var(--text-secondary); max-width: 600px; margin: 0 auto; }

        /* STATS */
        .stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2.5rem;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem 2.5rem;
            text-align: center;
            min-width: 140px;
        }
        .stat-card .num {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-card .label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0.3rem;
        }

        /* PROGRESS */
        .progress-section {
            max-width: 800px;
            margin: 0 auto 2rem;
            padding: 0 1rem;
        }
        .progress-bar {
            background: var(--bg-card);
            border-radius: 12px;
            height: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .progress-fill {
            height: 100%;
            background: var(--gradient-1);
            border-radius: 12px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.8rem;
        }
        .progress-text { color: var(--text-secondary); font-size: 0.9rem; }
        .progress-pct { color: var(--accent-light); font-weight: 700; font-size: 1.1rem; }

        /* NAVIGATION */
        .day-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            max-width: 800px;
            margin: 0 auto 3rem;
            padding: 0 1rem;
        }
        .day-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        .day-btn:hover { border-color: var(--accent); color: var(--accent-light); background: rgba(108,99,255,0.1); }
        .day-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
        .day-btn.done { background: rgba(34,197,94,0.15); border-color: var(--green); color: var(--green); }

        /* DAY SECTION */
        .day-section {
            max-width: 900px;
            margin: 0 auto 3rem;
            padding: 0 1rem;
        }
        .day-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .day-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
        }
        .day-header h2 span {
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .day-counter {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .day-counter strong { color: var(--accent-light); }

        /* WORD CARDS */
        .word-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.8rem;
        }
        .word-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.2rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .word-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--gradient-1);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .word-card:hover { border-color: var(--accent); background: var(--bg-card-hover); }
        .word-card:hover::before { opacity: 1; }
        .word-card.mastered { border-color: var(--green); }
        .word-card.mastered::before { background: var(--gradient-2); opacity: 1; }

        .word-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .word-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .word-pos {
            font-size: 0.75rem;
            background: rgba(108,99,255,0.2);
            color: var(--accent-light);
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .word-meaning {
            margin-top: 0.6rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .word-example {
            display: none;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border);
            font-size: 0.88rem;
            color: #7c7ca0;
            font-style: italic;
        }
        .word-card.open .word-example { display: block; }
        .word-card .master-btn {
            background: none;
            border: 2px solid var(--border);
            border-radius: 8px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .word-card .master-btn:hover { border-color: var(--green); }
        .word-card.mastered .master-btn { background: var(--green); border-color: var(--green); }
        .word-card.mastered .master-btn::after { content: "✓"; color: #fff; font-weight: bold; font-size: 0.9rem; }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 3rem 1rem;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        footer a { color: var(--accent-light); text-decoration: none; }

        /* SCROLL */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* ANIMATION */
        .word-card { animation: fadeUp 0.4s ease-out both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<div class="hero">

let mastered = JSON.parse(localStorage.getItem('sat-mastered') || '[]');
let activeDay = 1;

function updateProgress() {
    const total = 500;
    const done = mastered.length;
    const pct = (done / total * 100).toFixed(0);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = done + ' / ' + total + ' words mastered';
    document.getElementById('progressPct').textContent = pct + '%';
}

function renderNav() {
    const nav = document.getElementById('dayNav');
    nav.innerHTML = '';
    for (let i = 1; i <= 20; i++) {
        const btn = document.createElement('button');
        btn.className = 'day-btn';
        if (i === activeDay) btn.classList.add('active');
        const dayWords = WORDS[i].map(w => w.word);
        const allMastered = dayWords.every(w => mastered.includes(w));
        if (allMastered) btn.classList.add('done');
        btn.textContent = 'Day ' + i;
        btn.onclick = () => { activeDay = i; renderAll(); };
        nav.appendChild(btn);
    }
}

function renderWords() {
    const app = document.getElementById('app');
    const words = WORDS[activeDay];
    const masteredCount = words.filter(w => mastered.includes(w.word)).length;

    let html = `<div class="day-section">
        <div class="day-header">
            <h2>Day <span>${activeDay}</span></h2>
            <div class="day-counter"><strong>${masteredCount}</strong> / ${words.length} mastered</div>
        </div>
        <div class="word-grid">`;

    words.forEach((w, i) => {
        const isMastered = mastered.includes(w.word);
        html += `<div class="word-card ${isMastered ? 'mastered' : ''}" style="animation-delay:${i * 0.03}s" onclick="this.classList.toggle('open')">
            <div class="word-top">
                <div>
                    <span class="word-name">${w.word}</span>
                    <span class="word-pos">${w.pos}</span>
                </div>
                <button class="master-btn" onclick="toggleMaster(event, '${w.word}')"></button>
            </div>
            <div class="word-meaning">${w.meaning}</div>
            <div class="word-example">"${w.example}"</div>
        </div>`;
    });

    html += '</div></div>';
    app.innerHTML = html;
}

function toggleMaster(e, word) {
    e.stopPropagation();
    if (mastered.includes(word)) {
        mastered = mastered.filter(w => w !== word);
    } else {
        mastered.push(word);
    }
    localStorage.setItem('sat-mastered', JSON.stringify(mastered));
    renderAll();
}

function renderAll() {
    renderNav();
    renderWords();
    updateProgress();
}

renderAll();
</script>
